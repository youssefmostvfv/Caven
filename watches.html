<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAVEN — كافِن | الساعات</title>
    <link rel="stylesheet" href="style.css?v=6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="watches-data.js?v=p320oy"></script>
</head>

<body>
    <!-- Navbar -->
    <header class="header">
        <a href="index.html" class="logo" style="text-decoration: none;">CAVEN — كافِن</a>
        <nav class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="products.html">المنتجات</a>
            <a href="accessories.html">الاكسسوارات</a>
            <a href="perfumes.html">العطور</a>
            <a href="watches.html" class="active">الساعات</a>
            <a href="#">من نحن</a>
        </nav>
        <div class="header-icons">
            <a href="index.html" class="mobile-home-icon" style="color:var(--text-dark); text-decoration:none;"><i
                    class="fas fa-home"></i></a>
            <i class="far fa-heart"></i>
            <i class="fas fa-shopping-bag"></i>
            <i class="fas fa-bars menu-toggle"></i>
        </div>
    </header>

    <!-- Mobile Menu -->
    <div class="mobile-menu">
        <div class="mobile-menu-header">
            <a href="index.html" class="logo" style="text-decoration: none;">CAVEN</a>
            <i class="fas fa-times close-menu"></i>
        </div>
        <nav class="mobile-nav-links">
            <a href="index.html"><i class="fas fa-home"></i> الرئيسية</a>
            <a href="products.html"><i class="fas fa-th-large"></i> المنتجات</a>
            <a href="accessories.html"><i class="fas fa-gem"></i> الاكسسوارات</a>
            <a href="perfumes.html"><i class="fas fa-spray-can-sparkles"></i> العطور</a>
            <a href="watches.html" class="active"><i class="far fa-clock"></i> الساعات</a>
            <a href="#" class="mobile-cart-link"><i class="fas fa-shopping-bag"></i> سلة المشتريات</a>
            <a href="#" class="mobile-wishlist-link"><i class="far fa-heart"></i> المفضلة</a>
        </nav>
    </div>

    <!-- Page Header -->
    <section class="page-header">
        <div class="breadcrumb">
            <a href="index.html" class="breadcrumb-link">الرئيسية</a> /
            <span class="current-page">الساعات</span>
        </div>
        <h1>الساعات</h1>
    </section>

    <!-- Watches Page Layout -->
    <section class="products-page-container accessories-section watches-page">

        <!-- Filters Sidebar -->
        <aside class="filters-sidebar">
            <div class="filter-header">
                <h3>تصفية المنتجات</h3>
                <i class="fas fa-chevron-down filter-mobile-toggle" style="cursor:pointer;"></i>
            </div>

            <div class="filter-body">
                <div class="filter-group">
                    <h4>النوع <i class="fas fa-chevron-down"></i></h4>
                    <ul class="checkbox-list" style="display: none;">
                        <li><input type="checkbox" id="type-men" class="acc-filter" value="men"> <label
                                for="type-men">رجالي</label></li>
                        <li><input type="checkbox" id="type-women" class="acc-filter" value="women"> <label
                                for="type-women">حريمي</label></li>
                    </ul>
                </div>
            </div>
        </aside>

        <!-- Watches Grid (built from watches-data.js) -->
        <main class="products-main">
            <div class="products-grid products-grid-page" id="watches-grid"></div>
            <script>
                (function () {
                    const grid = document.getElementById('watches-grid');
                    const cardHtml = (w, v, title) => `
                <div class="product-card" data-type="${w.type}"
                    onclick="window.location.href='product-details.html?img=${v.images[0]}&title=${encodeURIComponent(title)}'"
                    style="cursor: pointer;">
                    <div class="product-image-box">
                        <button class="wishlist-btn" onclick="event.stopPropagation();"><i
                                class="far fa-heart"></i></button>
                        <img src="${v.images[0]}" alt="${title}" loading="lazy">
                    </div>
                    <div class="product-info">
                        <h3>${title}</h3>
                        <div class="acc-price">
                            ${w.price} ج.م
                            ${w.oldPrice ? `<span class="acc-old-price">${w.oldPrice} ج.م</span>` : ''}
                        </div>
                    </div>
                </div>`;

                    Object.values(window.WATCHES).forEach(w => {
                        // Every watch gets its own block; colors of the same watch side by side in a horizontal row
                        grid.insertAdjacentHTML('beforeend', `
                <div class="watch-model-row" data-type="${w.type}">
                    <div class="watch-model-head">
                        <h3>${w.title}</h3>
                        ${w.variants.length > 1 ? `<span>${w.variants.length} ألوان</span>` : ''}
                    </div>
                    <div class="watch-model-scroll">
                        ${w.variants.map(v => cardHtml(w, v, w.variants.length > 1 ? `${w.title} - ${v.color}` : w.title)).join('')}
                    </div>
                </div>`);
                    });

                    // Type filter
                    document.querySelectorAll('.acc-filter').forEach(cb => cb.addEventListener('change', () => {
                        const selected = Array.from(document.querySelectorAll('.acc-filter:checked')).map(c => c.value);
                        grid.querySelectorAll(':scope > [data-type]').forEach(card => {
                            card.style.display = (!selected.length || selected.includes(card.dataset.type)) ? '' : 'none';
                        });
                    }));
                })();
            </script>
        </main>
    </section>

    <script src="script.js?v=4"></script>
</body>

</html>
